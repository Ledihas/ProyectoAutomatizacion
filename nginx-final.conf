# ============================================
# Configuración Final de Nginx
# Sin modificar código, solo Nginx
# ============================================

# Frontend - Aplicación React en /whatsapp/
location /whatsapp {
    return 301 /whatsapp/;
}

location /whatsapp/ {
    proxy_pass http://localhost:3000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    
    # Reescribir rutas de assets en el HTML
    sub_filter 'href="/assets/' 'href="/whatsapp/assets/';
    sub_filter 'src="/assets/' 'src="/whatsapp/assets/';
    sub_filter 'href="/favicon' 'href="/whatsapp/favicon';
    sub_filter 'src="/favicon' 'src="/whatsapp/favicon';
    sub_filter_once off;
    sub_filter_types text/html text/css text/javascript application/javascript;
    proxy_set_header Accept-Encoding "";
}

# Servir assets del frontend directamente
location /whatsapp/assets/ {
    proxy_pass http://localhost:3000/assets/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_cache_valid 200 1d;
    add_header Cache-Control "public, immutable";
}

# Evolution API en /whatsapp-api/
location /whatsapp-api/ {
    proxy_pass http://localhost:8081/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    
    # Timeouts más largos para Evolution API
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# N8N en /whatsapp-n8n/
location /whatsapp-n8n {
    return 301 /whatsapp-n8n/;
}

location /whatsapp-n8n/ {
    proxy_pass http://localhost:5678/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    
    # Reescribir rutas de assets en el HTML de N8N
    sub_filter 'href="/assets/' 'href="/whatsapp-n8n/assets/';
    sub_filter 'src="/assets/' 'src="/whatsapp-n8n/assets/';
    sub_filter 'href="/static/' 'href="/whatsapp-n8n/static/';
    sub_filter 'src="/static/' 'src="/whatsapp-n8n/static/';
    sub_filter 'href="/favicon' 'href="/whatsapp-n8n/favicon';
    sub_filter 'src="/favicon' 'src="/whatsapp-n8n/favicon';
    sub_filter 'action="/' 'action="/whatsapp-n8n/';
    sub_filter '"baseUrl":"/"' '"baseUrl":"/whatsapp-n8n/"';
    sub_filter_once off;
    sub_filter_types text/html text/css text/javascript application/javascript application/json;
    proxy_set_header Accept-Encoding "";
}

# Servir assets de N8N directamente
location /whatsapp-n8n/assets/ {
    proxy_pass http://localhost:5678/assets/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_cache_valid 200 1d;
    add_header Cache-Control "public, immutable";
}

location /whatsapp-n8n/static/ {
    proxy_pass http://localhost:5678/static/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_cache_valid 200 1d;
    add_header Cache-Control "public, immutable";
}

