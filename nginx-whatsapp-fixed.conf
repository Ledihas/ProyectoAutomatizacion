# Configuración de Nginx para servir el proyecto en /whatsapp/
# Esta configuración maneja correctamente aplicaciones que no soportan base path

# Frontend - Aplicación React en /whatsapp/
location /whatsapp {
    # Redirigir /whatsapp a /whatsapp/
    rewrite ^/whatsapp$ /whatsapp/ permanent;
}

location /whatsapp/ {
    proxy_pass http://localhost:3000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    
    # Configuración para SPA (Single Page Application)
    proxy_intercept_errors on;
    error_page 404 = @whatsapp_fallback;
}

location @whatsapp_fallback {
    proxy_pass http://localhost:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Evolution API en /whatsapp-api/
location /whatsapp-api/ {
    proxy_pass http://localhost:8081/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    
    # Timeouts más largos para Evolution API
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# N8N en /whatsapp-n8n/
# N8N necesita configuración especial porque no soporta base path
location /whatsapp-n8n {
    return 301 /whatsapp-n8n/;
}

location /whatsapp-n8n/ {
    proxy_pass http://localhost:5678/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    
    # Configurar N8N para que funcione con base path
    proxy_set_header X-Forwarded-Prefix /whatsapp-n8n;
    
    # Reescribir respuestas HTML para ajustar rutas
    sub_filter 'href="/' 'href="/whatsapp-n8n/';
    sub_filter 'src="/' 'src="/whatsapp-n8n/';
    sub_filter 'action="/' 'action="/whatsapp-n8n/';
    sub_filter_once off;
    sub_filter_types text/html text/css text/javascript application/javascript;
}

# Webhooks de N8N (sin autenticación)
location /whatsapp-webhook/ {
    proxy_pass http://localhost:5678/webhook/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
}
